<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>我的足迹地图</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ===== 全局重置与变量 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0f1117;
      --panel-bg:     #1a1d27;
      --panel-bg2:    #13151f;
      --panel-border: #2a2d3e;
      --accent:       #6c63ff;
      --accent-glow:  rgba(108,99,255,.35);
      --accent2:      #ff6b9d;
      --text:         #e8eaf0;
      --text-dim:     #8b8fa8;
      --mark-fill:    rgba(108,99,255,.45);
      --mark-stroke:  #6c63ff;
      --hover-fill:   rgba(255,107,157,.35);
      --hover-stroke: #ff6b9d;
      --radius:       12px;
      --shadow:       0 8px 32px rgba(0,0,0,.5);
      --sidebar-w:    300px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* Leaflet 暗色覆盖 */
    .leaflet-container { background: #0f1117 !important; }
    .leaflet-control-zoom a { background: #1a1d27 !important; color: #e8eaf0 !important; border-color: #2a2d3e !important; }
    .leaflet-control-attribution { background: rgba(15,17,23,.8) !important; color: #4a4d5e !important; font-size: 9px !important; }
    .leaflet-control-attribution a { color: #6c63ff !important; }

    /* ===== 顶层布局 ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ===== 顶部标题栏 ===== */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      z-index: 100;
      flex-shrink: 0;
    }

    #header .logo { font-size: 20px; }

    #header h1 {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    #header .spacer { flex: 1; }

    /* 统计徽章 */
    .stat-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, rgba(108,99,255,.18), rgba(255,107,157,.12));
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 5px 12px;
      min-width: 60px;
    }
    .stat-badge .num {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }
    .stat-badge .lbl {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 1px;
      white-space: nowrap;
    }

    /* 按钮 */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(108,99,255,.1);
    }
    .btn.danger:hover {
      border-color: #ff4d6d;
      color: #ff4d6d;
      background: rgba(255,77,109,.08);
    }
    .btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(108,99,255,.12);
    }

    /* ===== 内容区（侧边栏 + 地图） ===== */
    #content {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ===== 侧边栏 ===== */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--panel-bg2);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: width .3s ease, opacity .3s ease;
      z-index: 50;
    }

    #sidebar.collapsed {
      width: 0;
      opacity: 0;
      pointer-events: none;
    }

    /* 侧边栏头部 */
    #sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
    }

    #sidebar-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 10px;
    }

    /* 搜索框 */
    #search-wrap {
      position: relative;
    }
    #search-input {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 7px 32px 7px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .2s;
    }
    #search-input::placeholder { color: var(--text-dim); }
    #search-input:focus { border-color: var(--accent); }
    #search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: none;
      padding: 2px;
    }
    #search-clear.visible { display: block; }

    /* 侧边栏主体 */
    #sidebar-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }
    #sidebar-body::-webkit-scrollbar { width: 4px; }
    #sidebar-body::-webkit-scrollbar-track { background: transparent; }
    #sidebar-body::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }

    /* 搜索结果 */
    #search-results {
      display: none;
      padding: 4px 0;
    }
    #search-results.visible { display: block; }

    .search-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background .15s;
      border-bottom: 1px solid rgba(42,45,62,.5);
    }
    .search-item:hover { background: rgba(108,99,255,.08); }
    .search-item .s-name { font-size: 13px; color: var(--text); }
    .search-item .s-path { font-size: 11px; color: var(--text-dim); flex: 1; }
    .search-item .s-check {
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--panel-border);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
      font-size: 10px;
    }
    .search-item.checked .s-check {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* 省份树 */
    #province-tree { display: block; }

    /* 省份行 */
    .prov-row {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 9px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(42,45,62,.4);
      transition: background .15s;
      user-select: none;
    }
    .prov-row:hover { background: rgba(108,99,255,.07); }
    .prov-row.active { background: rgba(108,99,255,.12); }

    .prov-arrow {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 10px;
      transition: transform .2s;
      flex-shrink: 0;
      margin-right: 6px;
    }
    .prov-row.open .prov-arrow { transform: rotate(90deg); }

    .prov-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .prov-badge {
      font-size: 10px;
      color: var(--accent);
      background: rgba(108,99,255,.15);
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 600;
      display: none;
    }
    .prov-badge.visible { display: inline; }

    /* 城市列表 */
    .city-list {
      display: none;
      background: rgba(0,0,0,.15);
    }
    .city-list.open { display: block; }

    /* 城市行 */
    .city-row {
      display: flex;
      align-items: center;
      padding: 7px 14px 7px 38px;
      cursor: pointer;
      border-bottom: 1px solid rgba(42,45,62,.25);
      transition: background .15s;
      user-select: none;
    }
    .city-row:hover { background: rgba(108,99,255,.07); }
    .city-row.active { background: rgba(108,99,255,.1); }

    .city-arrow {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 9px;
      transition: transform .2s;
      flex-shrink: 0;
      margin-right: 6px;
    }
    .city-row.open .city-arrow { transform: rotate(90deg); }

    .city-name {
      flex: 1;
      font-size: 12px;
      color: var(--text);
    }

    .city-badge {
      font-size: 10px;
      color: var(--accent2);
      background: rgba(255,107,157,.12);
      border-radius: 10px;
      padding: 1px 6px;
      font-weight: 600;
      display: none;
    }
    .city-badge.visible { display: inline; }

    /* 县区列表 */
    .county-list {
      display: none;
      background: rgba(0,0,0,.1);
    }
    .county-list.open { display: block; }

    /* 县区行 */
    .county-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 58px;
      cursor: pointer;
      border-bottom: 1px solid rgba(42,45,62,.2);
      transition: background .15s;
      user-select: none;
    }
    .county-row:hover { background: rgba(108,99,255,.06); }
    .county-row.checked { background: rgba(108,99,255,.1); }

    .county-checkbox {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      border: 1.5px solid var(--panel-border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      font-size: 9px;
      color: transparent;
    }
    .county-row.checked .county-checkbox {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .county-name {
      font-size: 12px;
      color: var(--text-dim);
      flex: 1;
    }
    .county-row.checked .county-name {
      color: var(--text);
      font-weight: 500;
    }

    /* 空状态 */
    .empty-hint {
      padding: 24px 14px;
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* 加载占位 */
    .loading-row {
      padding: 10px 14px 10px 38px;
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mini-spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--panel-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }

    /* 城市进度条 */
    .prov-progress {
      height: 3px;
      background: rgba(42,45,62,.5);
      margin: 4px 14px 4px 58px;
      border-radius: 2px;
    }
    .prov-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      transition: width .3s;
    }

    /* ===== 地图区域 ===== */
    #map-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* ===== 侧边栏切换按钮（地图边缘）===== */
    #sidebar-toggle {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      z-index: 300;
      width: 20px;
      height: 52px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-left: none;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 11px;
      transition: background .2s, color .2s;
      box-shadow: 2px 0 8px rgba(0,0,0,.3);
    }
    #sidebar-toggle:hover {
      background: rgba(108,99,255,.15);
      color: var(--accent);
    }

    /* ===== 信息浮层 ===== */
    #info-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 10px 18px;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      min-width: 260px;
    }
    #info-panel.show { display: flex; }

    #info-panel .region-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }
    #info-panel .region-meta {
      font-size: 11px;
      color: var(--text-dim);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toggle-btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: all .2s;
    }
    .toggle-btn.add {
      background: var(--accent);
      color: #fff;
    }
    .toggle-btn.add:hover { background: #7b73ff; }
    .toggle-btn.remove {
      background: rgba(255,77,109,.15);
      color: #ff4d6d;
      border: 1px solid rgba(255,77,109,.3);
    }
    .toggle-btn.remove:hover { background: rgba(255,77,109,.25); }

    /* ===== 加载遮罩 ===== */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 500;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity .4s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--panel-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ===== 提示 ===== */
    #hint {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(15,17,23,.85);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 12px;
      color: var(--text-dim);
      pointer-events: none;
      transition: opacity .5s;
    }

    /* ===== 图例 ===== */
    #legend {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      background: rgba(15,17,23,.85);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .legend-item .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.visited { background: rgba(108,99,255,.6); border: 1px solid var(--accent); }
    .dot.hover { background: rgba(255,107,157,.5); border: 1px solid var(--accent2); }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: var(--accent);
      color: #fff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    #toast.show { opacity: 1; }

    /* ===== 移动端 ===== */
    #mobile-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(0,0,0,.4);
    }
    #mobile-overlay.visible { display: block; }

    #btn-sidebar-mobile { display: none; }

    .hide-mobile { display: inline; }

    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 45;
        transform: translateX(-100%);
        transition: transform .3s ease;
        width: 280px;
      }
      #sidebar.collapsed { width: 280px; opacity: 1; pointer-events: auto; transform: translateX(-100%); }
      #sidebar.mobile-open { transform: translateX(0); }
      #sidebar-toggle { display: none; }
      #btn-sidebar { display: none; }
      #btn-sidebar-mobile { display: inline-flex; }
      .hide-mobile { display: none; }
      #info-panel { bottom: 12px; left: 12px; right: 12px; transform: none; min-width: auto; }
      #hint { bottom: 60px; }
      #legend { bottom: 12px; right: 12px; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- 顶部标题栏 -->
  <header id="header">
    <span class="logo">🗺️</span>
    <h1>我的足迹地图</h1>
    <div class="spacer"></div>

    <div class="stat-badge">
      <span class="num" id="county-count">0</span>
      <span class="lbl">县/区</span>
    </div>
    <div class="stat-badge">
      <span class="num" id="city-count">0</span>
      <span class="lbl">城市</span>
    </div>
    <div class="stat-badge">
      <span class="num" id="province-count">0</span>
      <span class="lbl">省份</span>
    </div>

    <button class="btn" id="btn-sidebar" title="切换选择面板">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
      </svg>
      <span>面板</span>
    </button>

    <button class="btn" id="btn-sidebar-mobile" title="打开选择面板">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <span>选择</span>
    </button>

    <button class="btn danger" id="btn-clear" title="清除所有足迹">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
      <span class="hide-mobile">清除</span>
    </button>
  </header>

  <div id="content">
    <aside id="sidebar">
      <div id="sidebar-header">
        <h2>📍 省市县选择</h2>
        <div id="search-wrap">
          <input type="text" id="search-input" placeholder="搜索县/区名称…" autocomplete="off" />
          <button id="search-clear">×</button>
        </div>
      </div>
      <div id="sidebar-body">
        <div id="search-results"></div>
        <div id="province-tree">
          <div class="empty-hint">加载行政区划中…</div>
        </div>
      </div>
    </aside>

    <div id="map-wrap">
      <div id="mobile-overlay"></div>
      <button id="sidebar-toggle" title="展开/收起面板">›</button>

      <div id="loading">
        <div class="spinner"></div>
        <p>地图加载中…</p>
      </div>

      <div id="hint">💡 使用左侧面板选择县/区标记足迹</div>

      <div id="map"></div>

      <div id="info-panel">
        <div class="region-name" id="region-name">—</div>
        <div class="region-meta" id="region-meta">—</div>
        <button class="toggle-btn add" id="toggle-btn">标记已到访</button>
      </div>

      <div id="legend">
        <div class="legend-item">
          <div class="dot visited"></div>
          <span>已到访</span>
        </div>
        <div class="legend-item">
          <div class="dot hover"></div>
          <span>当前选中</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

/* ============================================================
   足迹地图 — Leaflet + DataV GeoJSON 版（免费，免 key）
   ============================================================ */

const DATA_API = 'https://geo.datav.aliyun.com/areas_v3/bound';

// ===== 状态 =====
const S = {
  visited: new Set(JSON.parse(localStorage.getItem('fp_visited') || '[]')),
  info:    JSON.parse(localStorage.getItem('fp_info') || '{}'),
  geoLayers: new Map(),
  hoverLayers: null,
  currentAdcode: null,
  map: null,
  cityCache: {},
  countyCache: {},
  featCache: {},   // 区县 GeoJSON 特征缓存
  loadingCities: new Set(),
  loadingCounties: new Set(),
  sidebarOpen: true,
  mobileOpen: false,
  provData: [], // 省份列表 [{adcode, name}]
};

function save() {
  localStorage.setItem('fp_visited', JSON.stringify([...S.visited]));
  localStorage.setItem('fp_info', JSON.stringify(S.info));
}

// ===== 统计 =====
function updateStats() {
  document.getElementById('county-count').textContent = S.visited.size;
  const cities = new Set(), provs = new Set();
  for (const code of S.visited) {
    const i = S.info[code];
    if (i?.cityAdcode) cities.add(i.cityAdcode);
    if (i?.provAdcode) provs.add(i.provAdcode);
  }
  document.getElementById('city-count').textContent = cities.size;
  document.getElementById('province-count').textContent = provs.size;
}

// ===== Toast =====
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ===== GeoJSON 样式 =====
function visitedStyle() { return { fillColor: '#6c63ff', fillOpacity: 0.42, color: '#6c63ff', weight: 2, opacity: 0.9 }; }
function selectedStyle() { return { fillColor: '#ff6b9d', fillOpacity: 0.45, color: '#ff6b9d', weight: 2.5, opacity: 1 }; }

function drawVisited(adcode, geojson) {
  clearVisited(adcode);
  const layer = L.geoJSON(geojson, {
    style: visitedStyle(),
    onEachFeature: (f, l) => { l.on('click', () => selectByAdcode(adcode)); }
  });
  layer.addTo(S.map);
  S.geoLayers.set(adcode, layer);
}

function clearVisited(adcode) {
  if (S.geoLayers.has(adcode)) { S.map.removeLayer(S.geoLayers.get(adcode)); S.geoLayers.delete(adcode); }
}

function clearHover() {
  if (S.hoverLayers) { S.map.removeLayer(S.hoverLayers); S.hoverLayers = null; }
}

function drawSelection(geojson) {
  clearHover();
  S.hoverLayers = L.geoJSON(geojson, { style: selectedStyle() }).addTo(S.map);
}

// ===== 面板 =====
function showPanel(name, meta, adcode) {
  document.getElementById('region-name').textContent = name;
  document.getElementById('region-meta').textContent = meta;
  const btn = document.getElementById('toggle-btn');
  const isV = S.visited.has(adcode);
  btn.textContent = isV ? '取消标记' : '标记已到访';
  btn.className = 'toggle-btn ' + (isV ? 'remove' : 'add');
  document.getElementById('info-panel').classList.add('show');
}

function hidePanel() {
  document.getElementById('info-panel').classList.remove('show');
  clearHover();
  S.currentAdcode = null;
}

// ===== 选中区域 =====
function selectByAdcode(adcode) {
  const info = S.info[adcode];
  if (!info) return;
  S.currentAdcode = adcode;
  fetchGeoJSON(adcode, geojson => {
    drawSelection(geojson);
    showPanel(info.name, [info.province, info.city].filter(Boolean).join(' · ') || '中国', adcode);
  });
}

// ===== 标记/取消 =====
function setVisited(adcode, visited, silent) {
  const info = S.info[adcode];
  const name = info?.name || adcode;

  if (visited) {
    if (S.visited.has(adcode)) return;
    S.visited.add(adcode);
    fetchGeoJSON(adcode, geojson => drawVisited(adcode, geojson));
    if (!silent) toast('🎉 已标记 ' + name + '！');
  } else {
    if (!S.visited.has(adcode)) return;
    S.visited.delete(adcode);
    clearVisited(adcode);
    if (!silent) toast('已取消 ' + name + ' 的足迹标记');
  }

  save();
  updateStats();
  syncCheckbox(adcode);

  if (S.currentAdcode === adcode) {
    const btn = document.getElementById('toggle-btn');
    btn.textContent = visited ? '取消标记' : '标记已到访';
    btn.className = 'toggle-btn ' + (visited ? 'remove' : 'add');
  }
}

function toggleVisited() {
  const adcode = S.currentAdcode;
  if (!adcode) return;
  setVisited(adcode, !S.visited.has(adcode));
}

// ===== 清除所有 =====
function clearAll() {
  if (S.visited.size === 0) { toast('还没有任何足迹记录'); return; }
  if (!confirm('确认清除全部 ' + S.visited.size + ' 条足迹记录？此操作不可撤销。')) return;
  S.visited.clear();
  S.geoLayers.forEach(l => S.map.removeLayer(l));
  S.geoLayers.clear();
  hidePanel();
  save();
  updateStats();
  refreshAllCheckboxes();
  toast('已清除所有足迹记录');
}

// ===== 恢复足迹 =====
function restoreVisited() {
  const list = [...S.visited];
  if (!list.length) return;
  let done = 0;
  list.forEach(adcode => {
    fetchGeoJSON(adcode, geojson => {
      drawVisited(adcode, geojson);
      done++;
      if (done === list.length) toast('✅ 已恢复 ' + list.length + ' 条足迹记录');
    });
  });
}

// ===== 地图初始化 =====
function initMap() {
  S.map = L.map('map', {
    center: [35, 105],
    zoom: 5,
    zoomControl: true,
    attributionControl: true,
  });

  // 高德免费瓦片（无需 key）
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: '1234',
    maxZoom: 18,
    minZoom: 3,
    attribution: '&copy; <a href="https://www.amap.com/">高德地图</a>',
  }).addTo(S.map);

  // 地图就绪
  setTimeout(() => {
    document.getElementById('loading').classList.add('hide');
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 600);
    updateStats();
    initProvinceTree();
    restoreVisited();
  }, 500);
}

// ===== DataV GeoJSON 获取 =====
const geoCache = {};
function fetchGeoJSON(adcode, cb) {
  // 先查本地特征缓存（区县级）
  if (S.featCache && S.featCache[adcode]) {
    cb(S.featCache[adcode]);
    return;
  }
  if (geoCache[adcode]) { cb(geoCache[adcode]); return; }
  fetch(DATA_API + '/' + adcode + '_full.json')
    .then(r => r.json())
    .then(data => { geoCache[adcode] = data; cb(data); })
    .catch(() => { console.warn('Failed to load GeoJSON:', adcode); });
}

// ===== 省份树初始化 =====
function initProvinceTree() {
  const tree = document.getElementById('province-tree');
  tree.innerHTML = '<div class="loading-row"><div class="mini-spinner"></div>加载省份数据…</div>';

  // 从中国全图获取省份列表
  fetchGeoJSON(100000, data => {
    S.provData = (data.features || []).map(f => ({
      adcode: f.properties.adcode,
      name: f.properties.name,
    })).filter(p => p.adcode && p.adcode !== 100000);
    renderProvinceTree();
  });
}

function renderProvinceTree() {
  const tree = document.getElementById('province-tree');
  tree.innerHTML = '';

  S.provData.forEach(prov => {
    const row = document.createElement('div');
    row.className = 'prov-row';
    row.dataset.adcode = prov.adcode;
    row.innerHTML = `
      <span class="prov-arrow">›</span>
      <span class="prov-name">${prov.name}</span>
      <span class="prov-badge" id="pbadge-${prov.adcode}"></span>
    `;

    const cityList = document.createElement('div');
    cityList.className = 'city-list';
    cityList.id = 'cities-' + prov.adcode;

    row.addEventListener('click', () => toggleProvince(prov, row, cityList));
    tree.appendChild(row);
    tree.appendChild(cityList);
  });

  refreshProvBadges();
}

// ===== 判断是否直辖市 =====
function isDirectMunicipality(adcode) {
  const prefix = String(adcode).slice(0, 2);
  return prefix === '11' || prefix === '12' || prefix === '31' || prefix === '50' || prefix === '81' || prefix === '82';
}

// ===== 展开省份 =====
function toggleProvince(prov, row, cityList) {
  if (row.classList.contains('open')) {
    row.classList.remove('open', 'active');
    cityList.classList.remove('open');
    return;
  }
  row.classList.add('open', 'active');
  cityList.classList.add('open');

  if (isDirectMunicipality(prov.adcode)) {
    // 直辖市：直接显示区县
    if (S.countyCache[prov.adcode]) { renderCountyList(prov, prov, cityList, 'county-row', 38); return; }
    if (S.loadingCounties.has(prov.adcode)) return;
    S.loadingCounties.add(prov.adcode);
    cityList.innerHTML = '<div class="loading-row"><div class="mini-spinner"></div>加载中…</div>';
    fetchGeoJSON(prov.adcode, data => {
      S.loadingCounties.delete(prov.adcode);
      const features = data.features || [];
      features.forEach(f => {
        const a = f.properties.adcode;
        if (a && !S.featCache[a]) {
          S.featCache[a] = { type: 'FeatureCollection', features: [f] };
        }
      });
      S.countyCache[prov.adcode] = features.map(f => ({
        adcode: f.properties.adcode,
        name: f.properties.name,
      }));
      features.forEach(f => {
        if (!S.info[f.properties.adcode]) {
          S.info[f.properties.adcode] = {
            name: f.properties.name,
            province: prov.name,
            city: prov.name,
            provAdcode: prov.adcode,
            cityAdcode: prov.adcode,
          };
        }
      });
      save();
      renderCountyList(prov, prov, cityList, 'county-row', 38);
    });
    return;
  }

  if (S.cityCache[prov.adcode]) { renderCities(prov, cityList); return; }
  if (S.loadingCities.has(prov.adcode)) return;
  S.loadingCities.add(prov.adcode);

  cityList.innerHTML = '<div class="loading-row"><div class="mini-spinner"></div>加载中…</div>';

  fetchGeoJSON(prov.adcode, data => {
    S.loadingCities.delete(prov.adcode);
    const features = data.features || [];
    S.cityCache[prov.adcode] = features.map(f => ({
      adcode: f.properties.adcode,
      name: f.properties.name,
    }));
    renderCities(prov, cityList);
  });
}

function renderCities(prov, container) {
  const cities = S.cityCache[prov.adcode] || [];
  container.innerHTML = '';
  if (!cities.length) { container.innerHTML = '<div class="empty-hint">暂无下级区划</div>'; return; }

  cities.forEach(city => {
    const row = document.createElement('div');
    row.className = 'city-row';
    row.dataset.adcode = city.adcode;
    row.innerHTML = `
      <span class="city-arrow">›</span>
      <span class="city-name">${city.name}</span>
      <span class="city-badge" id="cbadge-${city.adcode}"></span>
    `;
    const countyList = document.createElement('div');
    countyList.className = 'county-list';
    countyList.id = 'counties-' + city.adcode;

    row.addEventListener('click', () => toggleCity(prov, city, row, countyList));
    container.appendChild(row);
    container.appendChild(countyList);
  });
  refreshCityBadges(prov.adcode);
}

function toggleCity(prov, city, row, countyList) {
  if (row.classList.contains('open')) {
    row.classList.remove('open', 'active');
    countyList.classList.remove('open');
    return;
  }
  row.classList.add('open', 'active');
  countyList.classList.add('open');

  if (S.countyCache[city.adcode]) { renderCounties(prov, city, countyList); return; }
  if (S.loadingCounties.has(city.adcode)) return;
  S.loadingCounties.add(city.adcode);

  countyList.innerHTML = '<div class="loading-row"><div class="mini-spinner"></div>加载中…</div>';

  fetchGeoJSON(city.adcode, data => {
    S.loadingCounties.delete(city.adcode);
    const features = data.features || [];
    // 缓存每个区县的 GeoJSON 特征
    features.forEach(f => {
      const a = f.properties.adcode;
      if (a && !S.featCache[a]) {
        S.featCache[a] = { type: 'FeatureCollection', features: [f] };
      }
    });
    S.countyCache[city.adcode] = features.map(f => ({
      adcode: f.properties.adcode,
      name: f.properties.name,
    }));
    features.forEach(f => {
      if (!S.info[f.properties.adcode]) {
        S.info[f.properties.adcode] = {
          name: f.properties.name,
          province: prov.name,
          city: city.name,
          provAdcode: prov.adcode,
          cityAdcode: city.adcode,
        };
      }
    });
    save();
    renderCounties(prov, city, countyList);
  });
}

function renderCountyList(prov, city, container, rowClass, padLeft) {
  const key = city.adcode;
  const counties = S.countyCache[key] || [];
  container.innerHTML = '';
  if (!counties.length) { container.innerHTML = '<div class="empty-hint">暂无下级区划</div>'; return; }

  const progress = document.createElement('div');
  progress.className = 'prov-progress';
  progress.style.marginLeft = padLeft + 'px';
  progress.innerHTML = '<div class="prov-progress-bar" id="prog-' + key + '" style="width:0%"></div>';
  container.appendChild(progress);

  counties.forEach(county => {
    const checked = S.visited.has(county.adcode);
    const row = document.createElement('div');
    row.className = rowClass + (checked ? ' checked' : '');
    row.id = 'cnty-row-' + county.adcode;
    row.dataset.adcode = county.adcode;
    row.style.paddingLeft = padLeft + 'px';
    row.innerHTML = `
      <div class="county-checkbox">${checked ? '✓' : ''}</div>
      <span class="county-name">${county.name}</span>
    `;
    row.addEventListener('click', e => {
      e.stopPropagation();
      onCountyToggle(prov, city, county, row);
    });
    container.appendChild(row);
  });
  updateCityProgress(key);
}

function renderCounties(prov, city, container) {
  renderCountyList(prov, city, container, 'county-row', 58);
}

function onCountyToggle(prov, city, county, row) {
  if (!S.info[county.adcode]) {
    S.info[county.adcode] = {
      name: county.name,
      province: prov.name,
      city: city.name,
      provAdcode: prov.adcode,
      cityAdcode: city.adcode,
    };
  }
  setVisited(county.adcode, !S.visited.has(county.adcode));
  updateCityProgress(city.adcode);
  refreshCityBadges(prov.adcode);
  refreshProvBadge(prov.adcode);
}

// ===== 搜索 =====
function doSearch(q) {
  const resultsEl = document.getElementById('search-results');
  const treeEl = document.getElementById('province-tree');

  if (!q) {
    resultsEl.classList.remove('visible');
    treeEl.style.display = '';
    return;
  }

  resultsEl.classList.add('visible');
  treeEl.style.display = 'none';
  resultsEl.innerHTML = '<div class="loading-row"><div class="mini-spinner"></div>搜索中…</div>';

  const seen = new Set();
  const results = [];

  // 1. 搜本地 countyCache
  for (const [, counties] of Object.entries(S.countyCache)) {
    for (const c of counties) {
      if (seen.has(c.adcode)) continue;
      if (c.name.includes(q)) {
        seen.add(c.adcode);
        const info = S.info[c.adcode];
        results.push({ adcode: c.adcode, name: c.name, path: info ? info.province + ' · ' + info.city : '', checked: S.visited.has(c.adcode) });
      }
    }
  }

  // 2. 搜本地 cityCache + info
  for (const adcode of Object.keys(S.info)) {
    if (seen.has(adcode)) continue;
    const info = S.info[adcode];
    if (info && info.name && info.name.includes(q)) {
      seen.add(adcode);
      results.push({ adcode, name: info.name, path: (info.province + ' · ' + info.city).replace(/^ · /,''), checked: S.visited.has(adcode) });
    }
  }

  function renderNow() {
    resultsEl.innerHTML = results.length
      ? results.slice(0, 30).map(r => `
        <div class="search-item ${r.checked ? 'checked' : ''}" data-adcode="${r.adcode}">
          <div class="s-check">${r.checked ? '✓' : ''}</div>
          <span class="s-name">${r.name}</span>
          <span class="s-path">${r.path}</span>
        </div>`).join('')
      : '<div class="empty-hint">没有找到匹配的县/区<br><small>试试展开省份后再搜索</small></div>';

    resultsEl.querySelectorAll('.search-item').forEach(item => {
      item.addEventListener('click', () => {
        const adcode = item.dataset.adcode;
        if (!S.info[adcode]) {
          S.info[adcode] = { name: item.querySelector('.s-name').textContent, province: '', city: '', provAdcode: adcode.slice(0,2)+'0000', cityAdcode: adcode.slice(0,4)+'00' };
        }
        setVisited(adcode, !S.visited.has(adcode));
        const checked = S.visited.has(adcode);
        item.classList.toggle('checked', checked);
        item.querySelector('.s-check').textContent = checked ? '✓' : '';
        selectByAdcode(adcode);
      });
    });
  }

  if (results.length >= 5) { renderNow(); return; }

  // 3. 后备：搜索省份级数据
  let pending = S.provData.length, done = 0;
  S.provData.forEach(prov => {
    fetchGeoJSON(prov.adcode, data => {
      done++;
      const features = data.features || [];
      const isMun = isDirectMunicipality(prov.adcode);
      features.forEach(f => {
        const a = f.properties.adcode, n = f.properties.name;
        if (!a || seen.has(a) || !n.includes(q)) return;
        seen.add(a);
        const info = S.info[a] || {};
        results.push({
          adcode: a,
          name: n,
          path: prov.name + (isMun ? '' : ' · ' + (info.city || n)),
          checked: S.visited.has(a),
        });
        // 如果还没 info，记录一下
        if (!S.info[a]) {
          S.info[a] = { name: n, province: prov.name, city: isMun ? prov.name : (info.city || ''), provAdcode: prov.adcode, cityAdcode: isMun ? prov.adcode : a.slice(0,4)+'00' };
        }
      });
      if (done === pending) { save(); renderNow(); }
      else if (results.length >= 5 && done > 3) { renderNow(); }
    });
  });
}

// ===== 同步勾选 =====
function syncCheckbox(adcode) {
  const row = document.getElementById('cnty-row-' + adcode);
  if (!row) return;
  const c = S.visited.has(adcode);
  row.classList.toggle('checked', c);
  row.querySelector('.county-checkbox').textContent = c ? '✓' : '';
  const info = S.info[adcode];
  if (info?.cityAdcode) { updateCityProgress(info.cityAdcode); refreshCityBadges(info.cityAdcode); }
  if (info?.provAdcode) refreshProvBadge(info.provAdcode);
}

function refreshAllCheckboxes() {
  document.querySelectorAll('.county-row').forEach(row => {
    const adcode = row.dataset.adcode;
    const c = S.visited.has(adcode);
    row.classList.toggle('checked', c);
    row.querySelector('.county-checkbox').textContent = c ? '✓' : '';
  });
  document.querySelectorAll('.prov-progress-bar').forEach(b => b.style.width = '0%');
  refreshProvBadges();
  document.querySelectorAll('.city-badge').forEach(b => { b.textContent = ''; b.classList.remove('visible'); });
}

function refreshProvBadge(adcode) {
  const el = document.getElementById('pbadge-' + adcode);
  if (!el) return;
  let n = 0;
  for (const a of S.visited) { if (S.info[a]?.provAdcode === adcode) n++; }
  if (n) { el.textContent = n; el.classList.add('visible'); }
  else { el.textContent = ''; el.classList.remove('visible'); }
}
function refreshProvBadges() { S.provData.forEach(p => refreshProvBadge(p.adcode)); }

function refreshCityBadges(provAdcode) {
  (S.cityCache[provAdcode] || []).forEach(c => {
    const el = document.getElementById('cbadge-' + c.adcode);
    if (!el) return;
    let n = 0;
    for (const a of S.visited) { if (S.info[a]?.cityAdcode === c.adcode) n++; }
    if (n) { el.textContent = n; el.classList.add('visible'); }
    else { el.textContent = ''; el.classList.remove('visible'); }
  });
}

function updateCityProgress(adcode) {
  const bar = document.getElementById('prog-' + adcode);
  if (!bar) return;
  const counties = S.countyCache[adcode] || [];
  if (!counties.length) return;
  const v = counties.filter(c => S.visited.has(c.adcode)).length;
  bar.style.width = Math.round(v / counties.length * 100) + '%';
}

// ===== 侧边栏切换 =====
function isMobile() { return window.innerWidth <= 768; }
function toggleSidebar() {
  if (isMobile()) {
    S.mobileOpen = !S.mobileOpen;
    document.getElementById('sidebar').classList.toggle('mobile-open', S.mobileOpen);
    document.getElementById('mobile-overlay').classList.toggle('visible', S.mobileOpen);
  } else {
    S.sidebarOpen = !S.sidebarOpen;
    document.getElementById('sidebar').classList.toggle('collapsed', !S.sidebarOpen);
    document.getElementById('sidebar-toggle').textContent = S.sidebarOpen ? '‹' : '›';
  }
}

// ===== 事件绑定 =====
document.getElementById('toggle-btn').addEventListener('click', toggleVisited);
document.getElementById('btn-clear').addEventListener('click', clearAll);
document.getElementById('btn-sidebar').addEventListener('click', toggleSidebar);
document.getElementById('btn-sidebar-mobile').addEventListener('click', toggleSidebar);
document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
document.getElementById('mobile-overlay').addEventListener('click', () => {
  S.mobileOpen = false;
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('mobile-overlay').classList.remove('visible');
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  const q = e.target.value.trim();
  document.getElementById('search-clear').classList.toggle('visible', !!q);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(q), 300);
});
document.getElementById('search-clear').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').classList.remove('visible');
  document.getElementById('search-results').classList.remove('visible');
  document.getElementById('province-tree').style.display = '';
});

// 启动
document.getElementById('sidebar-toggle').textContent = '‹';
window.addEventListener('load', initMap);
</script>
